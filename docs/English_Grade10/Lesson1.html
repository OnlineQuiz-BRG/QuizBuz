  p.lead{margin:0 0 18px;color:#444}

const perPage = 10;
let page = 0;
const totalPages = Math.ceil(questions.length / perPage);
const quizArea = document.getElementById('quizArea');
const pageInfo = document.getElementById('pageInfo');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const submitBtn = document.getElementById('submitBtn');
const resultsDiv = document.getElementById('results');

function letter(i){ return ['A','B','C','D'][i] || '' }

function renderPage(){
  quizArea.innerHTML = '';
  const start = page * perPage;
  const end = Math.min(start + perPage, questions.length);
  for(let i=start;i<end;i++){
    const qi = questions[i];
    const qbox = document.createElement('div');
    qbox.className = 'question';
    const qnum = i+1;
    qbox.innerHTML = '<div class="qtext">Q' + qnum + '. ' + qi.q + '</div>';
    const optdiv = document.createElement('div');
    optdiv.className = 'options';
    qi.options.forEach((opt, idx) => {
      const id = 'q' + i + '_opt' + idx;
      const label = document.createElement('label');
      label.className = 'option';
      label.htmlFor = id;
      label.innerHTML = '<input type="radio" name="q' + i + '" id="' + id + '" value="' + idx + '"> <span>' + letter(idx) + ') ' + opt + '</span>';
      optdiv.appendChild(label);
    });
    qbox.appendChild(optdiv);
    quizArea.appendChild(qbox);
  }
  pageInfo.innerText = 'Page ' + (page+1) + ' of ' + totalPages;
  prevBtn.disabled = page === 0;
  nextBtn.disabled = page === totalPages - 1;
}

prevBtn.addEventListener('click', () => { if(page>0){ page--; renderPage(); window.scrollTo({top:0,behavior:"smooth"}); }});
nextBtn.addEventListener('click', () => { if(page < totalPages-1){ page++; renderPage(); window.scrollTo({top:0,behavior:"smooth"}); }});

function getResponses(){
  const resp = [];
  for(let i=0;i<questions.length;i++){
    const els = document.getElementsByName('q'+i);
    let val = null;
    for(const el of els){ if(el.checked){ val = parseInt(el.value); break; } }
    resp.push(val);
  }
  return resp;
}

submitBtn.addEventListener('click', () => {
  const name = document.getElementById('studentName').value.trim();
  const roll = document.getElementById('rollNo').value.trim();
  const cls = document.getElementById('className').value.trim();
  if(!name || !roll || !cls){
    if(!confirm('Student details are incomplete. Continue anyway?')) return;
  }
  const resp = getResponses();
  let score = 0;
  const details = [];
  resp.forEach((r, idx) => {
    const correct = questions[idx].answer;
    const isCorrect = r === correct;
    if(isCorrect) score++;
    details.push({ qIndex: idx, selected: r, correct });
  });

  // show results
  resultsDiv.style.display = 'block';
  resultsDiv.innerHTML = '<div class="meta"><strong>Student:</strong> ' + (name||'—') + ' &nbsp; <strong>Roll:</strong> ' + (roll||'—') + ' &nbsp; <strong>Class:</strong> ' + (cls||'—') + '</div>';
  resultsDiv.innerHTML += '<div style="font-size:18px;font-weight:700">Score: ' + score + ' / ' + questions.length + '</div>';
  resultsDiv.innerHTML += '<div class="small" style="margin-top:6px">Correct answers are shown below. Your selected answer is indicated beside each question.</div>';

  // Detailed answers
  details.forEach(d => {
    const qi = questions[d.qIndex];
    const qnum = d.qIndex + 1;
    const sel = (d.selected === null) ? 'No answer' : letter(d.selected) + ') ' + qi.options[d.selected];
    const corr = letter(d.correct) + ') ' + qi.options[d.correct];
    const mark = (d.selected === d.correct) ? '<span class="correct">✔ Correct</span>' : '<span class="incorrect">✖ Incorrect</span>';
    resultsDiv.innerHTML += '<div class="answer-line"><div><strong>Q' + qnum + '.</strong> ' + qi.q + '</div>';
    resultsDiv.innerHTML += '<div style="margin-top:6px"><strong>Your answer:</strong> ' + (d.selected===null? '<em>None</em>' : sel) + ' &nbsp; ' + mark + '</div>';
    resultsDiv.innerHTML += '<div style="margin-top:6px"><strong>Correct Answer:</strong> ' + corr + '</div></div>';
  });

  // scroll to results
  resultsDiv.scrollIntoView({behavior:'smooth'});
});
